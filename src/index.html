<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Stencil Component Starter</title>

  <script type="module" src="/build/lib.esm.js"></script>
  <script nomodule src="/build/lib.js"></script>
</head>

<body>
  <button-component onClick="clickModal()" size="medium" variant="contained">
    Abrir Modal
  </button-component>
  <button class="contained-button-class">teste</button>
  <modal-component open="false" handleClose="clickClose()" />

  <script>
    const modalComponent = document.querySelector('modal-component');

    const clickModal = () => {
      modalComponent.setAttribute('open', true)
    }

    const clickClose = () => {
      console.log("teste")
      modalComponent.setAttribute('open', false)
    }
  </script>
</body>

</html>
